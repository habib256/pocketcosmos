<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover : les commandes tactiles tiennent compte des encoches (env(safe-area-inset-*)). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Simulation de Fusée</title>
    <style>
        html {
            /* Pas de « tirer pour rafraîchir » ni de rebond de page sur tablette. */
            overscroll-behavior: none;
        }
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            overscroll-behavior: none;
            /* Pas de double-tap zoom ; le pincement de la zone de jeu est géré par le jeu. */
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            background-color: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        canvas {
            display: block;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            /* Boîte CSS liée à la fenêtre (et non à la taille du tampon de dessin) : lors d'une
               rotation paysage -> portrait, l'ancien canvas plus large que le nouvel écran
               débordait ; le navigateur mobile dézoomait alors la page (échelle 0,75 mesurée) et
               innerWidth restait à l'ancienne largeur — le canvas ne se réduisait jamais. */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Zone de jeu : aucun geste du navigateur (défilement, zoom de page) ; le glissement
               à un doigt déplace la vue, le pincement à deux doigts zoome (InputController). */
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        #instructions {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            background: rgba(20, 20, 20, 0.97);
            padding: 8px 12px;
            border-radius: 10px;
            box-shadow: 0 2px 12px #0008;
            max-width: 240px;
            width: max-content;
            height: auto;
            z-index: 9999;
        }
        #instructions img {
            width: 72px;
            height: 72px;
            margin: 0 auto 2px auto;
            display: block;
        }
        #instructions table {
            border-collapse: collapse;
            margin: 2px auto 2px auto;
            font-size: 0.88em;
        }
        #instructions td {
            border: 1px solid #888;
            padding: 1px 4px;
        }
        #instructions .key {
            font-weight: bold;
            display: inline-block;
            min-width: 40px; /* Ajustez si nécessaire */
            text-align: center;
        }
        #instructions .action {
            text-align: left;
        }
        #instructions .sous-texte {
            font-size: 0.78em;
            color: #aaa;
            margin-top: 0;
        }
        #instructions .accroche {
            font-size: 0.80em;
            color: #8cf;
            margin-top: 1px;
            text-align: center;
        }
        #audioControls {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 100;
        }
        #audioControls button {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 5px;
            border-radius: 3px;
            cursor: pointer;
        }
        #audioControls button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* ----- Écran de démarrage : utilisable au doigt et sur petit écran ----- */
        #instructions {
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        #instructions .ligne-haut {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }
        #instructions .colonne-logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 160px;
            flex-shrink: 0;
        }
        #instructions .colonne-logo img {
            width: 160px;
            height: 160px;
            margin-top: 5px;
        }
        #instructions .colonne-controles {
            flex: 1 1 260px;
            min-width: 0;
        }
        #instructions .ligne-depart {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            width: 100%;
            margin-top: 10px;
            /* Petit écran : le panneau défile, mais le choix du monde et « Prêt ! » restent
               visibles en bas (collés), sans avoir à faire défiler jusqu'à eux. */
            position: sticky;
            bottom: -15px;               /* recouvre le padding bas du panneau */
            padding: 8px 0 15px 0;
            margin-bottom: -15px;
            background: rgb(30, 30, 30);
            z-index: 1;
        }
        #instructions select,
        #instructions button {
            min-height: 48px;
            font-size: 16px; /* 16 px : Safari iOS ne zoome pas la page à la sélection */
            touch-action: manipulation;
        }
        #instructions select {
            padding: 4px 8px;
            max-width: 100%;
        }
        #instructions #startButton {
            padding: 6px 18px;
            cursor: pointer;
        }
        #instructions .titre-tactile {
            font-weight: bold;
            text-align: left;
            padding-top: 6px;
            color: #9cf;
        }
        @media (max-width: 560px), (max-height: 560px) {
            #instructions .colonne-logo { width: 100%; flex-direction: row; gap: 10px; }
            #instructions .colonne-logo img { width: 64px; height: 64px; margin-top: 0; }
            #instructions .colonne-logo p { text-align: left !important; margin: 2px 0 !important; }
        }

        /* ----- Commandes tactiles (controllers/TouchControlsController.js) ----- */
        #commandesTactiles {
            display: none;
            position: fixed;
            inset: 0;
            pointer-events: none;         /* seuls les boutons captent les doigts */
            z-index: 50;                  /* sous ⚙️ (100) et l'écran de démarrage (9999) */
            font-family: Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        body.commandes-tactiles #commandesTactiles { display: block; }
        #commandesTactiles .groupe-tactile {
            position: absolute;
            display: flex;
            gap: 14px;
            pointer-events: none;
        }
        #commandesTactiles .bouton-tactile {
            pointer-events: auto;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            min-width: 52px;
            min-height: 52px;
            padding: 2px 5px;
            margin: 0;
            color: #fff;
            background: rgba(255, 255, 255, 0.13);
            border: 2px solid rgba(255, 255, 255, 0.45);
            border-radius: 14px;
            font-family: inherit;
            line-height: 1;
            cursor: pointer;
            opacity: 0.85;
        }
        #commandesTactiles .bouton-tactile .symbole { font-size: 22px; font-weight: bold; }
        #commandesTactiles .bouton-tactile .legende { font-size: 10px; margin-top: 3px; opacity: 0.9; }
        #commandesTactiles .bouton-tactile.actif {
            background: rgba(120, 200, 255, 0.45);
            border-color: rgba(170, 225, 255, 0.95);
            opacity: 1;
        }
        /* Pouce gauche : rotation */
        #commandesTactiles .groupe-rotation {
            left: calc(16px + env(safe-area-inset-left, 0px));
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        }
        #commandesTactiles .bouton-rotation { width: 76px; height: 76px; border-radius: 50%; }
        #commandesTactiles .bouton-rotation .symbole { font-size: 34px; }
        /* Pouce droit : poussée (grand) au-dessus de rétro ; au-dessus de ⚙️ en bas à droite */
        #commandesTactiles .groupe-poussee {
            right: calc(16px + env(safe-area-inset-right, 0px));
            bottom: calc(70px + env(safe-area-inset-bottom, 0px));
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        #commandesTactiles .bouton-poussee { width: 88px; height: 88px; border-radius: 50%; }
        #commandesTactiles .bouton-poussee .symbole { font-size: 34px; }
        #commandesTactiles .bouton-retro { width: 68px; height: 60px; border-radius: 30px; }
        /* Barre d'outils : en bas, entre les deux pouces ; passe sur deux lignes si besoin */
        #commandesTactiles .barre-outils {
            left: calc(200px + env(safe-area-inset-left, 0px));
            right: calc(130px + env(safe-area-inset-right, 0px));
            bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            flex-wrap: wrap-reverse;
            justify-content: center;
            align-content: flex-start;
            gap: 6px;
        }
        #commandesTactiles .bouton-outil { min-width: 60px; }
        /* Écran étroit (téléphone en portrait) : barre d'outils au-dessus des pouces */
        @media (max-width: 600px) {
            #commandesTactiles .barre-outils {
                left: calc(8px + env(safe-area-inset-left, 0px));
                right: calc(8px + env(safe-area-inset-right, 0px));
                bottom: calc(230px + env(safe-area-inset-bottom, 0px));
            }
            #commandesTactiles .bouton-outil { min-width: 56px; }
        }
        /* Fenêtre très basse (téléphone en paysage, petit cadre) : boutons un peu plus compacts */
        @media (max-height: 430px) {
            #commandesTactiles .bouton-rotation { width: 64px; height: 64px; }
            #commandesTactiles .bouton-poussee { width: 72px; height: 72px; }
            #commandesTactiles .bouton-retro { height: 52px; }
            /* ▼ à gauche de ▲, sur une seule rangée : la colonne montait jusqu'au cadre
               Missions/Cargo dessiné en haut à droite. */
            #commandesTactiles .groupe-poussee { gap: 10px; flex-direction: row-reverse; align-items: flex-end; }
            #commandesTactiles .barre-outils { right: calc(180px + env(safe-area-inset-right, 0px)); }
        }
        /* Bouton ✋ (à côté de ⚙️) */
        #audioControls #basculeTactile.actif { background: rgba(120, 200, 255, 0.45); } /* l'emporte sur :hover collant au doigt */
        #basculeTactile.bascule-seule { position: fixed; right: 10px; bottom: 10px; z-index: 100; }
        /* Doigt : cibles ⚙️ / ✋ / son agrandies */
        @media (pointer: coarse) {
            #audioControls button { min-width: 44px; min-height: 44px; font-size: 18px; }
            #audioControls { bottom: calc(6px + env(safe-area-inset-bottom, 0px)); right: calc(6px + env(safe-area-inset-right, 0px)); }
        }
        /* ----- Guide « Découverte » et légende des flèches (controllers/GuideDecouverteController.js) -----
           Colonne à gauche, SOUS le HUD (santé/carburant/vitesse, ≈ 130 px) et AU-DESSUS des boutons
           du pouce gauche (≈ 92 px) : la fusée, centrée par la caméra, reste visible. */
        #colonnePedagogique {
            position: fixed;
            left: calc(12px + env(safe-area-inset-left, 0px));
            top: 136px;
            /* 290 px, réduit sur écran moyen pour laisser libre le centre ± 120 px (pincer, glisser) :
               768 px de large → 244 px. */
            width: clamp(230px, calc(50vw - 140px), 290px);
            max-width: calc(100vw - 24px);
            max-height: calc(100% - 136px - 108px);
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 60;                  /* au-dessus des commandes tactiles (50), sous ⚙️ (100) */
            font-family: Arial, sans-serif;
            color: #fff;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        #colonnePedagogique [hidden] { display: none !important; }
        /* La colonne laisse passer les doigts (glisser/pincer la vue) ; seuls les panneaux les captent. */
        #colonnePedagogique { pointer-events: none; }
        #colonnePedagogique section { pointer-events: auto; }
        #colonnePedagogique.replie #guideDecouverte { align-self: flex-start; }   /* replié : seulement le bouton 🎯 */
        #colonnePedagogique section {
            background: rgba(8, 12, 28, 0.88);
            border: 1px solid rgba(150, 190, 255, 0.35);
            border-radius: 10px;
            padding: 6px 10px 8px;
            flex-shrink: 0;
        }
        #colonnePedagogique .guide-entete { display: flex; gap: 6px; align-items: center; }
        #colonnePedagogique .guide-bouton {
            min-height: 44px;
            min-width: 44px;
            padding: 4px 10px;
            font-family: inherit;
            font-size: 15px;
            color: #fff;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 10px;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        #colonnePedagogique .guide-bouton:disabled { opacity: 0.35; cursor: default; }
        #colonnePedagogique .guide-bouton:focus-visible { outline: 2px solid #9cf; outline-offset: 2px; }
        #colonnePedagogique .guide-bascule { flex: 1; text-align: left; font-weight: bold; }
        /* Défi réussi pendant que le panneau est replié (téléphone) : bouton 🎯 mis en évidence. */
        #colonnePedagogique .guide-bascule.guide-nouveau { background: rgba(124, 252, 154, 0.35); border-color: #7cfc9a; }
        #colonnePedagogique .guide-compteur { color: #7cfc9a; font-weight: normal; }
        #colonnePedagogique .guide-titre { font-size: 15px; margin: 8px 0 4px; color: #9cf; }
        #colonnePedagogique .guide-consigne { font-size: 14px; line-height: 1.35; margin: 0 0 6px; }
        #colonnePedagogique .guide-mesure { font-size: 14px; line-height: 1.35; margin: 0; color: #ffe08a; }
        #colonnePedagogique .guide-explication { font-size: 14px; line-height: 1.4; }
        #colonnePedagogique .guide-explication p { margin: 6px 0; }
        #colonnePedagogique .guide-bravo { color: #7cfc9a; font-weight: bold; }
        #colonnePedagogique .guide-note { font-size: 12.5px; color: #c8d0e0; font-style: italic; }
        #colonnePedagogique .guide-bilan { border-top: 1px solid rgba(150, 190, 255, 0.35); padding-top: 6px; }
        #colonnePedagogique .guide-suivant { width: 100%; margin-top: 4px; font-weight: bold; }
        #legendeAffichage h3 { font-size: 13.5px; margin: 2px 0 4px; color: #9cf; }
        #legendeAffichage ul { list-style: none; padding: 0; margin: 0; }
        #legendeAffichage li { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; line-height: 1.3; margin: 3px 0; }
        #legendeAffichage p { font-size: 12.5px; line-height: 1.3; margin: 4px 0 0; color: #dde; }
        #legendeAffichage .trait { flex: 0 0 24px; position: relative; height: 0; margin: 8px 6px 0 0; border-top: 3px solid; }
        #legendeAffichage .trait::after {
            content: ''; position: absolute; right: -7px; top: -7px;
            border-left: 8px solid currentColor; border-top: 5.5px solid transparent; border-bottom: 5.5px solid transparent;
        }
        #legendeAffichage .trait-attraction { color: #ff4fd8; border-color: #ff4fd8; }
        #legendeAffichage .trait-poussee { color: #ff6a3d; border-color: #ff6a3d; }
        #legendeAffichage .trait-vitesse { color: #5fe3ff; border-top-style: dashed; }
        #legendeAffichage .trait-mission { color: rgb(255, 215, 0); border-top-style: dashed; border-top-width: 2px; }
        #legendeAffichage .couleur-fort { color: #ff6060; font-weight: bold; }
        #legendeAffichage .couleur-faible { color: #7cfc00; font-weight: bold; }
        /* Téléphone en portrait : la barre d'outils tactile remonte à ~230 px du bas. */
        @media (max-width: 600px) {
            #colonnePedagogique { width: 290px; max-height: calc(100% - 136px - 300px); }
        }
        .cargo-icons img {
            width: 16px;
            height: 16px;
            margin: 1px;
            vertical-align: middle;
        }
    </style>
    
    <!-- Filet de sécurité posé AVANT tout chargement de script : le DOM de #errorOverlay n'existe
         pas encore ici, on bufferise ; main.js (installerGestionnaireErreurs) rejoue le buffer.
         La phase de CAPTURE est indispensable : les erreurs de chargement de ressource
         (balise script en 404 / CDN bloqué) ne bouillonnent pas jusqu'à window. -->
    <script>
        window.__erreursPrecoces = [];
        window.addEventListener('error', function(event) {
            // Plafond : cet écouteur reste posé pour toute la vie de la page ; une erreur
            // répétée à chaque frame ferait autrement grossir le tampon sans fin.
            if (window.__erreursPrecoces.length >= 20) return;
            const cible = event.target;
            if (cible && cible !== window && cible.tagName === 'SCRIPT') {
                window.__erreursPrecoces.push('Échec de chargement du script : ' + (cible.src || '(inline)'));
            } else if (event.message) {
                window.__erreursPrecoces.push(event.message + (event.filename ? ' (' + event.filename + ':' + event.lineno + ')' : ''));
            }
        }, true);
    </script>

    <!-- Bibliothèques embarquées (lib/, versions figées) : l’app fonctionne sans Internet -->
    <script src="lib/matter.min.js"></script>
    <!-- Plugin Matter Attractors (ignorer le warning de compatibilité, il fonctionne quand même) -->
    <script src="lib/matter-attractors.min.js"></script>
    <!-- TensorFlow.js - avec fallback backend pour éviter SIGILL -->
    <script src="lib/tf.min.js"></script>
    <script>
        // Forcer le backend CPU si WebGL échoue pour éviter les erreurs SIGILL
        (async function() {
            try {
                await tf.setBackend('webgl');
                console.log('[TensorFlow.js] Backend WebGL activé');
            } catch (e) {
                console.warn('[TensorFlow.js] WebGL non disponible, utilisation du backend CPU');
                try {
                    await tf.setBackend('cpu');
                    console.log('[TensorFlow.js] Backend CPU activé');
                } catch (e2) {
                    console.error('[TensorFlow.js] Erreur backend:', e2);
                }
            }
            await tf.ready();
        })();
    </script>

<body> 
    <!-- Élément Canvas pour le rendu du jeu -->
    <canvas id="gameCanvas"></canvas>
    
    <!-- Élément audio pour la musique d'ambiance -->
    <audio id="ambientAudio" loop></audio>
    
    <!-- Contrôles audio -->
    <div id="audioControls">
        <button id="openOptions" title="Options">⚙️</button>
        <div id="optionsPanel" style="display:none; position:absolute; bottom:40px; right:0; background: rgba(0,0,0,0.9); border: 1px solid #555; border-radius: 6px; padding: 8px; min-width: 220px; z-index: 200;">
            <div style="display:flex; align-items:center; gap:6px; margin-bottom:6px;">
                <button id="toggleAudio">🔇</button>
                <span id="audioTitle" style="cursor: pointer;" title="Cliquer pour changer de musique">Musique spatiale</span>
            </div>
            <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                <input type="checkbox" id="showNamesCheckbox" />
                <span id="labelShowNames">Afficher les noms</span>
            </label>
            <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                <input type="checkbox" id="showStationsCheckbox" />
                <span id="labelShowStations">Afficher les stations</span>
            </label>
        </div>
    </div>
    
    <!-- Script d'initialisation du plugin Matter Attractors -->
    <script>
        // Note: Ignorer le warning "Plugin.use: matter-attractors est pour matter-js@^0.12.0"
        // car ça fonctionne parfaitement avec matter-js@0.19.0
        try {
            Matter.use(MatterAttractors);
        } catch (e) {
            console.error("Erreur lors de l'initialisation du plugin Matter Attractors:", e);
        }
    </script>
    
    <!-- Gestion de l'audio d'ambiance -->
    <script>
        // Liste des fichiers audio disponibles
        const ambientSounds = [
            'assets/sound/ambiant/Wave Ganymede flyby_Juno.wav',
            'assets/sound/ambiant/Enceladus Hiss audio 256 kbps.mp3',
            'assets/sound/ambiant/whistlerWaves.mp3',
            'assets/sound/ambiant/plasmawaves-chorus.mp3',
            'assets/sound/ambiant/plasmatic_hiss.wav',
            'assets/sound/ambiant/voyager1-TsunamiWaves.mp3',
            'assets/sound/ambiant/cassini_saturn_radio_waves1.mp3',
            'assets/sound/ambiant/kepler_star_KIC7671081B.mp3',
            'assets/sound/ambiant/kepler_star_KIC12268220C.mp3',
            'assets/sound/ambiant/cassini_saturn_radio_waves2.mp3',
            'assets/sound/ambiant/sun_sonification.wav',
            'assets/sound/ambiant/Voyager: Interstellar Plasma Sounds.mp3',
            'assets/sound/ambiant/Chorus Radio Waves within Earth\'s Atmosphere.mp3'
        ];
        
        // Index du son actuel (pour parcours séquentiel)
        let currentSoundIndex = 0;
        
        // Fonction pour charger le son suivant (parcours circulaire)
        function loadNextSound() {
            // Passer au son suivant (parcours circulaire)
            currentSoundIndex = (currentSoundIndex + 1) % ambientSounds.length;
            const nextSound = ambientSounds[currentSoundIndex];
            
            // Extraction du nom du fichier pour l'affichage
            const soundName = nextSound.split('/').pop().replace('.mp3', '').replace('.wav', '');
            audioTitle.textContent = soundName;
            
            // Sauvegarde du niveau de volume actuel
            const currentVolume = audioElement.volume || 0.3;
            const wasPlaying = !audioElement.paused;
            
            // Définir la source audio
            audioElement.src = nextSound;
            audioElement.volume = currentVolume;
            
            // Reprendre la lecture si elle était en cours
            if (wasPlaying) {
                audioElement.play().catch(e => {
                    console.log('Erreur lors de la lecture:', e);
                });
            }
            
            return nextSound;
        }
        
        // Configuration de l'audio
        const audioElement = document.getElementById('ambientAudio');
        const toggleButton = document.getElementById('toggleAudio');
        const audioTitle = document.getElementById('audioTitle');
        const showNamesCheckbox = document.getElementById('showNamesCheckbox');
        const showStationsCheckbox = document.getElementById('showStationsCheckbox');
        const labelShowNames = document.getElementById('labelShowNames');
        const labelShowStations = document.getElementById('labelShowStations');
        const openOptions = document.getElementById('openOptions');
        const optionsPanel = document.getElementById('optionsPanel');
        
        // Tri alphabétique des sons pour une meilleure organisation (optionnel)
        ambientSounds.sort();
        
        // Chargement initial d'un son
        window.addEventListener('DOMContentLoaded', () => {
            // Choisir un son aléatoire pour commencer
            currentSoundIndex = Math.floor(Math.random() * ambientSounds.length) - 1;
            loadNextSound();
            
            // Définir un volume initial raisonnable
            audioElement.volume = 0.3;
        });

        // Gestion des options d'affichage (noms et stations)
        if (typeof window.UI_STATE === 'undefined') window.UI_STATE = {};
        // Cases décochées par défaut => ne pas afficher (donc cacher les noms)
        window.UI_STATE.hideBodyNames = !showNamesCheckbox.checked;
        window.UI_STATE.showStations = !!showStationsCheckbox.checked;
        // Synchroniser les libellés avec les icônes définies dans constants.js (UI.ICONS)
        function updateOptionLabels() {
            try {
                const planetIcon = (typeof UI !== 'undefined' && UI.ICONS && UI.ICONS.PLANET) ? UI.ICONS.PLANET : '🪐';
                const gasIcon = (typeof UI !== 'undefined' && UI.ICONS && UI.ICONS.GAS) ? UI.ICONS.GAS : '⛽';
                if (labelShowNames) labelShowNames.textContent = `${planetIcon} Afficher les noms`;
                if (labelShowStations) labelShowStations.textContent = `${gasIcon} Afficher les stations`;
            } catch (e) {}
        }
        updateOptionLabels();
        // Ce script inline s'exécute AVANT le chargement de constants.js (plus bas dans la page) :
        // le premier appel ci-dessus retombe donc toujours sur les icônes de secours, et modifier
        // UI.ICONS dans constants.js n'avait aucun effet sur l'affichage initial. On repasse une
        // fois la page chargée, quand `UI` est réellement défini.
        window.addEventListener('load', updateOptionLabels);

        // Rendre le focus au jeu après une interaction SOURIS avec un contrôle de la page.
        // Les navigateurs laissent le focus sur un <button>/<input> après un clic : la barre
        // Espace (touche de poussée principale) activait alors ce contrôle au lieu de piloter la
        // fusée — cliquer sur ⚙️ puis appuyer sur Espace refermait le panneau en boucle.
        // On ne retire le focus que sur un vrai clic pointeur (detail > 0) afin de préserver la
        // navigation au clavier (Tab + Espace reste fonctionnel pour qui n'utilise pas la souris).
        // Distinguer souris et clavier par un `pointerdown` préalable plutôt que par `ev.detail`.
        // Cliquer le LIBELLÉ d'une case à cocher (la grande zone cliquable) fait suivre au
        // navigateur un clic SYNTHÉTIQUE sur l'input, avec `detail === 0` — indiscernable d'une
        // activation clavier. Le focus restait donc sur la case, et la barre Espace (poussée
        // principale) la cochait/décochait au lieu de piloter la fusée.
        let clicPointeur = false;
        const marquerPointeur = () => { clicPointeur = true; };
        const rendreFocusAuJeu = (ev) => {
            if (!clicPointeur) return;                   // activation clavier : ne pas voler le focus
            clicPointeur = false;
            const el = ev && ev.currentTarget;
            if (el && typeof el.blur === 'function') el.blur();
        };
        const controlesFocusables = [openOptions, toggleButton, showNamesCheckbox, showStationsCheckbox];
        controlesFocusables.forEach((el) => {
            if (!el) return;
            el.addEventListener('pointerdown', marquerPointeur);
            el.addEventListener('click', rendreFocusAuJeu);
        });
        // Les libellés relaient le clic vers leur case : marquer aussi le pointeur depuis eux.
        [labelShowNames, labelShowStations].forEach((el) => {
            if (el && el.parentNode) el.parentNode.addEventListener('pointerdown', marquerPointeur);
        });

        showNamesCheckbox.addEventListener('change', (e) => {
            window.UI_STATE.hideBodyNames = !e.target.checked;
            updateOptionLabels();
        });
        showStationsCheckbox.addEventListener('change', (e) => {
            window.UI_STATE.showStations = !!e.target.checked;
            updateOptionLabels();
        });
        
        // Gestion du bouton mute/unmute.
        // Le bouton ne pilotait QUE la musique d'ambiance : la boucle des propulseurs et les
        // impacts, joués via window.audioManager, restaient audibles après un « mute ».
        // AudioManager.setEnabled() existait pour cela mais n'était appelé de nulle part.
        const appliquerSourdine = (coupe) => {
            if (window.audioManager && typeof window.audioManager.setEnabled === 'function') {
                window.audioManager.setEnabled(!coupe);
            }
        };
        toggleButton.addEventListener('click', () => {
            if (audioElement.paused) {
                // N'afficher 🔊 que si la lecture DÉMARRE réellement : play() renvoie une promesse
                // qui peut être rejetée (politique d'autoplay, fichier illisible). L'ancien code
                // laissait ce rejet non géré et affichait 🔊 inconditionnellement — le bouton
                // prétendait que la musique jouait alors que tout était silencieux.
                // Les effets sont rétablis dans tous les cas : même si la politique d'autoplay
                // refuse la musique, l'intention du joueur est bien de réactiver le son.
                appliquerSourdine(false);
                audioElement.play()
                    .then(() => { toggleButton.textContent = '🔊'; })
                    .catch(() => { toggleButton.textContent = '🔇'; });
            } else {
                audioElement.pause();
                appliquerSourdine(true);
                toggleButton.textContent = '🔇';
            }
        });
        
        // Gestion du clic sur le titre pour changer de musique
        audioTitle.addEventListener('click', () => {
            loadNextSound();
            // Notification visuelle du changement
            audioTitle.style.opacity = 0.5;
            setTimeout(() => {
                audioTitle.style.opacity = 1;
            }, 300);
        });

        // Affichage/fermeture du panneau d'options
        let optionsOpen = false;
        openOptions.addEventListener('click', (e) => {
            e.stopPropagation();
            optionsOpen = !optionsOpen;
            optionsPanel.style.display = optionsOpen ? 'block' : 'none';
        });
        // Fermer si clic en dehors
        document.addEventListener('click', (e) => {
            if (!optionsOpen) return;
            const target = e.target;
            if (!optionsPanel.contains(target) && target !== openOptions) {
                optionsOpen = false;
                optionsPanel.style.display = 'none';
            }
        });

        // Activation audio sur premier clic/clavier (déblocage autoplay)
        function setupAudioUnlock() {
            const onUserGesture = () => {
                // S'assurer qu'une source est chargée
                if (!audioElement.src) {
                    loadNextSound();
                }
                audioElement.play().then(() => {
                    toggleButton.textContent = '🔊';
                    window.removeEventListener('pointerdown', onUserGesture);
                    window.removeEventListener('keydown', onUserGesture);
                }).catch(() => {
                    // Si rejeté, on laisse les listeners en place pour réessayer au prochain geste
                });
            };
            window.addEventListener('pointerdown', onUserGesture);
            window.addEventListener('keydown', onUserGesture);
        }
        // Initialiser le déblocage après chargement des ressources
        window.addEventListener('load', setupAudioUnlock);
    </script>
